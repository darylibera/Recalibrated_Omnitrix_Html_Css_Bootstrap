<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Omnitrix | Login</title>

    <link rel="stylesheet" href="./src/site.css" />
  </head>

  <body>
    <header class="site-nav">
      <div class="nav-container">
        <a href="index.html" class="logo"> OMNITRIX </a>

        <nav>
          <ul class="nav-links">
            <li>
              <a href="./index.html"> Home </a>
            </li>

            <li>
              <a href="Omnitrix.html"> Omnitrix </a>
            </li>

            <li>
              <a href="login.html"> Login </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <section class="login-section">
        <div class="login-box">
          <span class="hero-badge"> OMNITRIX ACCESS </span>

          <h1>LOGIN</h1>

          <p>Enter your credentials to access your Omnitrix profile.</p>

          <form>
            <div class="form-group">
              <label for="email"> Email </label>

              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
              />
            </div>

            <div class="form-group">
              <label for="password"> Password </label>

              <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="form-options">
              <label>
                <input type="checkbox" />

                Remember me
              </label>

              <a href="#"> Forgot password? </a>
            </div>

            <button type="submit" class="login-button">LOGIN</button>

            <p class="register-text">
              Don't have an account?

              <a href="#"> Create one </a>
            </p>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-container">
        <div>
          <a href="./index.html" class="footer-logo">          
            OMNITRIX
          </a>
          <p>The ultimate transformation</p>
        </div>
        <div class="footer-links">
          <a href="index.html"> Home </a>

          <a href="Omnitrix.html"> Omnitrix </a>

          <a href="login.html"> Login </a>
        </div>
      </div>
      <div class="copyright">&copy; 2026 Omnitrix. All rights reserved</div>
    </footer>
  </body>
</html>
